apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gke-access-proxy
rules:
  - apiGroups: [kubeflow.org]
    resources: [workspaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gke-access-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gke-access-proxy
subjects:
  - kind: ServiceAccount
    name: gke-access-proxy
    namespace: kubeflow-workspaces
