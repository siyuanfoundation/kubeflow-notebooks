apiVersion: kubeflow.org/v1beta1
kind: Workspace
metadata:
  name: jupyterlab-snapshot-workspace
  namespace: default
spec:
  paused: false
  kind: "jupyterlab-snapshot"
  podTemplate:
    volumes:
      home: "workspace-home-pvc"
    options:
      imageConfig: "jupyter-scipy:v1.10.0"
      podConfig: "tiny_cpu"
