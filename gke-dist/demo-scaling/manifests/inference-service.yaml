# =============================================================================
# GPU Inference Service (Stage 3 of the Scaling ML Demo)
# =============================================================================
# Deploys the model trained in Stage 2 as a GPU-accelerated inference service.
#
# The serving container runs on NVIDIA L4 GPU nodes (via the ComputeClass gpu-l4-spot)
# and performs real-time GPU forward passes using PyTorch CUDA tensors.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-scaling-demo-serve-code
  namespace: default
  labels:
    app.kubernetes.io/part-of: kubeflow-ml-scaling-demo
data:
  # Populated by scripts/run_demo.sh or apply_inference.sh from demo-scaling/jobs/serve.py.
  serve.py: |
    # placeholder — replaced at deploy time
    print("serve.py not injected; run scripts/apply_inference.sh")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-model-inference
  namespace: default
  labels:
    app: scaling-model-inference
    app.kubernetes.io/part-of: kubeflow-ml-scaling-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scaling-model-inference
  template:
    metadata:
      labels:
        app: scaling-model-inference
        app.kubernetes.io/part-of: kubeflow-ml-scaling-demo
    spec:
      nodeSelector:
        cloud.google.com/compute-class: gpu-l4-spot
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "cloud.google.com/compute-class"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: server
          image: pytorch/pytorch:2.2.2-cuda12.1-cudnn8-runtime
          command: ["bash", "-c"]
          args:
            - |
              pip install --no-cache-dir google-cloud-storage >/dev/null 2>&1
              exec python /app/serve.py
          env:
            - name: BUCKET_NAME
              value: "BUCKET_NAME_PLACEHOLDER"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: serve-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 600
            periodSeconds: 15
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: serve-code
          configMap:
            name: ml-scaling-demo-serve-code
---
apiVersion: v1
kind: Service
metadata:
  name: scaling-model-inference
  namespace: default
  labels:
    app: scaling-model-inference
    app.kubernetes.io/part-of: kubeflow-ml-scaling-demo
spec:
  selector:
    app: scaling-model-inference
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
